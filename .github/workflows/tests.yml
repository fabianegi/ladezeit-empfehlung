name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline-Regressionstests
        run: python -m unittest discover -s tests -v
      - name: Offline-Beispiel
        run: python src/poc.py --offline --tag 2026-08-14 --abfahrt 07:00 --dauer 3
